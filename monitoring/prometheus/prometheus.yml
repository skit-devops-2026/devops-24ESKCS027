global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'eventhive'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['eventhive:5000', 'host.docker.internal:5000']
        labels:
          app: 'eventhive'
          env: 'production'
