
name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main]

jobs:
  # M1 — Repository hygiene
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # M3 — Build and test
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: make install

      - name: Run automated tests
        env:
          JWT_SECRET: ci-test-only-secret-not-for-production
          ADMIN_NAME: CI Test Administrator
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-test-only-password
          GRAFANA_ADMIN_PASSWORD: ci-test-only-grafana-password
          NODE_ENV: test
        run: make test

      - name: Build validation
        run: make build

  # M4 — Kubernetes Manifest Validation
  k8s-validation:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes manifests with Kustomize
        run: |
          kubectl kustomize k8s/ > rendered-k8s.yaml
          test -s rendered-k8s.yaml

  # M5 — Containerization & Smoke Testing
  docker:
    name: Build, test and push container
    needs: [build-and-test, k8s-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: eventhive:test
          build-args: |
            GITHUB_SHA=${{ github.sha }}

      - name: Run container health smoke test
        env:
          JWT_SECRET: ci-test-only-secret-not-for-production
          ADMIN_NAME: CI Test Administrator
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-test-only-password
          NODE_ENV: test
        run: |
          docker run -d --name test-eventhive \
            -p 5000:5000 \
            -e JWT_SECRET="$JWT_SECRET" \
            -e ADMIN_NAME="$ADMIN_NAME" \
            -e ADMIN_EMAIL="$ADMIN_EMAIL" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e NODE_ENV="$NODE_ENV" \
            eventhive:test
          sleep 5
          curl --fail --retry 5 --retry-delay 2 \
            http://localhost:5000/health || (docker logs test-eventhive && exit 1)
          docker stop test-eventhive
          docker rm test-eventhive

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/skit-devops-2026/devops-24eskcs027:latest
            ghcr.io/skit-devops-2026/devops-24eskcs027:${{ github.sha }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
