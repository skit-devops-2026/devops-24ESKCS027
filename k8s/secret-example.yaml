# Kubernetes Secret Example
# To encode your own credentials in base64:
# Linux/macOS: echo -n "your-secret-value" | base64
# Windows PowerShell: [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("your-secret-value"))

apiVersion: v1
kind: Secret
metadata:
  name: eventhive-secrets
  namespace: eventhive
  labels:
    app: eventhive
type: Opaque
data:
  JWT_SECRET: <BASE64_ENCODED_JWT_SECRET>
  ADMIN_EMAIL: <BASE64_ENCODED_ADMIN_EMAIL>
  ADMIN_PASSWORD: <BASE64_ENCODED_ADMIN_PASSWORD>
