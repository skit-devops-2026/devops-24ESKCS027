apiVersion: v1
kind: Service
metadata:
  name: eventhive-service
  namespace: eventhive
  labels:
    app: eventhive
    app.kubernetes.io/name: eventhive
spec:
  type: NodePort
  selector:
    app: eventhive
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
