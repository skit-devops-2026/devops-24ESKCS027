apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eventhive-hpa
  namespace: eventhive
  labels:
    app: eventhive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eventhive-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
